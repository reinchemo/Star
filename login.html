<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>Staff Login · Starlink Ultranet</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        :root {
            --c-navy: #0f172a;
            --c-navy-2: #1e293b;
            --c-cyan: #22d3ee;
            --c-sky: #0ea5e9;
            --c-blue: #2563eb;
            --c-gold: #fbbf24;
            --c-orange: #f97316;
            --c-red: #ef4444;
            --c-green: #10b981;
            --c-text: #e2e8f0;
            --c-text-mute: #94a3b8;
        }
        
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            min-height: 100dvh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #0f172a 0%, #1e3a8a 45%, #0369a1 100%);
            padding: 16px;
            position: relative;
            overflow-x: hidden;
        }
        
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background: radial-gradient(circle at 80% 20%, rgba(251, 191, 36, 0.18), transparent 45%), radial-gradient(circle at 20% 80%, rgba(34, 211, 238, 0.22), transparent 45%);
            pointer-events: none;
        }
        
        .orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(70px);
            opacity: 0.35;
            pointer-events: none;
        }
        
        .orb-1 {
            width: 300px;
            height: 300px;
            background: #2563eb;
            top: -80px;
            right: -80px;
            animation: orbFloat 18s ease-in-out infinite;
        }
        
        .orb-2 {
            width: 250px;
            height: 250px;
            background: #f59e0b;
            bottom: -80px;
            left: -80px;
            animation: orbFloat 22s ease-in-out infinite reverse;
        }
        
        .orb-3 {
            width: 180px;
            height: 180px;
            background: #22d3ee;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            opacity: 0.15;
            animation: orbFloat 25s ease-in-out infinite alternate;
        }
        
        @keyframes orbFloat {
            0%,
            100% {
                transform: translate(0, 0) scale(1);
            }
            50% {
                transform: translate(40px, -30px) scale(1.15);
            }
        }
        
        .login-container {
            width: 100%;
            max-width: 440px;
            position: relative;
            z-index: 10;
            animation: fadeUp 0.6s ease-out;
        }
        
        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: #94a3b8;
            text-decoration: none;
            font-size: 0.82rem;
            font-weight: 500;
            margin-bottom: 20px;
            transition: all 0.3s ease;
            background: rgba(255, 255, 255, 0.06);
            padding: 8px 16px;
            border-radius: 50px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
        }
        
        .back-link:hover {
            color: #fff;
            background: rgba(255, 255, 255, 0.12);
            transform: translateX(-4px);
            border-color: rgba(34, 211, 238, 0.4);
        }
        
        .login-card {
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border-radius: 24px;
            padding: 40px 32px 32px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 25px 60px -20px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.06);
            position: relative;
            overflow: hidden;
        }
        
        .login-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, #22d3ee, #fbbf24, #f97316, #22d3ee);
            background-size: 300% 100%;
            animation: shimmer 4s ease-in-out infinite;
        }
        
        @keyframes shimmer {
            0% {
                background-position: 0% 50%;
            }
            100% {
                background-position: 300% 50%;
            }
        }
        
        .login-logo {
            text-align: center;
            margin-bottom: 24px;
        }
        
        .login-logo .logo-icon {
            width: 64px;
            height: 64px;
            background: linear-gradient(135deg, #0ea5e9, #2563eb);
            border-radius: 18px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 1.8rem;
            margin-bottom: 12px;
            box-shadow: 0 12px 30px -8px rgba(37, 99, 235, 0.6);
            animation: logoFloat 4s ease-in-out infinite;
        }
        
        @keyframes logoFloat {
            0%,
            100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-4px);
            }
        }
        
        .login-logo h2 {
            color: #fff;
            font-family: 'Space Grotesk', sans-serif;
            font-size: 1.35rem;
            font-weight: 700;
            letter-spacing: -0.01em;
        }
        
        .login-logo p {
            color: #94a3b8;
            font-size: 0.82rem;
            margin-top: 4px;
        }
        
        .login-status {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-size: 0.72rem;
            color: #4ade80;
            margin-bottom: 22px;
            padding: 6px 14px;
            background: rgba(74, 222, 128, 0.1);
            border-radius: 50px;
            border: 1px solid rgba(74, 222, 128, 0.2);
            width: fit-content;
            margin-left: auto;
            margin-right: auto;
        }
        
        .login-status .dot {
            width: 6px;
            height: 6px;
            background: #4ade80;
            border-radius: 50%;
            animation: dotPulse 2s ease-in-out infinite;
            box-shadow: 0 0 8px #4ade80;
        }
        
        @keyframes dotPulse {
            0%,
            100% {
                opacity: 1;
                transform: scale(1);
            }
            50% {
                opacity: 0.4;
                transform: scale(0.75);
            }
        }
        /* ---------- FORM ---------- */
        
        .form-group {
            margin-bottom: 18px;
        }
        
        .form-group label {
            display: block;
            color: rgba(255, 255, 255, 0.75);
            font-size: 0.8rem;
            font-weight: 600;
            margin-bottom: 6px;
            letter-spacing: 0.3px;
        }
        
        .form-group label .required {
            color: #f87171;
        }
        
        .input-wrapper {
            position: relative;
        }
        
        .input-wrapper .input-icon {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: #64748b;
            font-size: 0.95rem;
            pointer-events: none;
            transition: color 0.25s;
        }
        
        .input-wrapper input {
            width: 100%;
            padding: 14px 16px 14px 46px;
            border-radius: 12px;
            border: 1.5px solid rgba(255, 255, 255, 0.12);
            background: rgba(255, 255, 255, 0.06);
            color: #fff;
            font-size: 0.95rem;
            font-family: inherit;
            transition: all 0.25s ease;
            -webkit-appearance: none;
        }
        
        .input-wrapper input::placeholder {
            color: rgba(255, 255, 255, 0.35);
        }
        
        .input-wrapper input:focus {
            outline: none;
            border-color: #22d3ee;
            background: rgba(255, 255, 255, 0.1);
            box-shadow: 0 0 0 4px rgba(34, 211, 238, 0.15);
        }
        
        .input-wrapper input:focus+.input-icon,
        .input-wrapper input:focus~.input-icon {
            color: #22d3ee;
        }
        
        .input-wrapper .toggle-password {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: #64748b;
            cursor: pointer;
            font-size: 0.95rem;
            padding: 8px;
            transition: color 0.2s;
        }
        
        .input-wrapper .toggle-password:hover {
            color: #fff;
        }
        
        .form-options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 22px;
            flex-wrap: wrap;
            gap: 10px;
        }
        
        .form-options .remember-me {
            display: flex;
            align-items: center;
            gap: 8px;
            color: rgba(255, 255, 255, 0.65);
            font-size: 0.82rem;
            cursor: pointer;
            user-select: none;
        }
        
        .form-options .remember-me input[type="checkbox"] {
            width: 16px;
            height: 16px;
            accent-color: #22d3ee;
            cursor: pointer;
        }
        
        .form-options .forgot-link {
            color: #22d3ee;
            font-size: 0.82rem;
            font-weight: 600;
            text-decoration: none;
            transition: color 0.2s;
            cursor: pointer;
            background: none;
            border: none;
            font-family: inherit;
            padding: 4px 6px;
        }
        
        .form-options .forgot-link:hover {
            color: #fff;
        }
        
        .btn-login {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(135deg, #2563eb, #0ea5e9);
            color: #fff;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            font-family: inherit;
            position: relative;
            overflow: hidden;
            box-shadow: 0 10px 30px -8px rgba(37, 99, 235, 0.6);
        }
        
        .btn-login::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -60%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.15) 0%, transparent 60%);
            transform: rotate(25deg);
            transition: all 0.6s ease;
            opacity: 0;
        }
        
        .btn-login:hover::before {
            left: 60%;
            opacity: 1;
        }
        
        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 40px -8px rgba(37, 99, 235, 0.8);
        }
        
        .btn-login:active {
            transform: scale(0.98);
        }
        
        .btn-login:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none !important;
        }
        
        .btn-login .spinner {
            display: none;
            width: 20px;
            height: 20px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-top: 2px solid #fff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        
        .btn-login.loading .spinner {
            display: inline-block;
        }
        
        .btn-login.loading .btn-text {
            display: none;
        }
        
        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
        
        .error-message {
            display: none;
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid rgba(239, 68, 68, 0.3);
            border-radius: 10px;
            padding: 12px 14px;
            color: #fca5a5;
            font-size: 0.85rem;
            margin-bottom: 14px;
            align-items: center;
            gap: 10px;
            animation: shake 0.4s;
        }
        
        .error-message.show {
            display: flex;
        }
        
        @keyframes shake {
            0%,
            100% {
                transform: translateX(0);
            }
            25% {
                transform: translateX(-6px);
            }
            75% {
                transform: translateX(6px);
            }
        }
        
        .success-message {
            display: none;
            background: rgba(74, 222, 128, 0.15);
            border: 1px solid rgba(74, 222, 128, 0.3);
            border-radius: 10px;
            padding: 12px 14px;
            color: #86efac;
            font-size: 0.85rem;
            margin-bottom: 14px;
            align-items: center;
            gap: 10px;
        }
        
        .success-message.show {
            display: flex;
        }
        
        .change-password-section {
            margin-top: 18px;
            padding-top: 18px;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
        }
        
        .change-password-toggle {
            background: none;
            border: none;
            color: rgba(255, 255, 255, 0.55);
            font-size: 0.82rem;
            cursor: pointer;
            transition: color 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-family: inherit;
            padding: 6px 0;
            font-weight: 500;
        }
        
        .change-password-toggle:hover {
            color: #fff;
        }
        
        .change-password-toggle i {
            transition: transform 0.3s ease;
        }
        
        .change-password-toggle.open i {
            transform: rotate(180deg);
        }
        
        .change-password-fields {
            display: none;
            margin-top: 14px;
            padding: 16px;
            background: rgba(255, 255, 255, 0.04);
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            animation: slideDown 0.3s ease;
        }
        
        .change-password-fields.open {
            display: block;
        }
        
        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-8px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .change-password-fields .form-group {
            margin-bottom: 12px;
        }
        
        .change-password-fields .form-group:last-of-type {
            margin-bottom: 0;
        }
        
        .change-password-fields label {
            font-size: 0.75rem;
            color: rgba(255, 255, 255, 0.6);
        }
        
        .change-password-fields .input-wrapper input {
            padding: 11px 14px 11px 40px;
            font-size: 0.88rem;
        }
        
        .change-password-fields .input-wrapper .input-icon {
            font-size: 0.85rem;
            left: 12px;
        }
        
        .btn-change-password {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(135deg, #2563eb, #0ea5e9);
            color: #fff;
            font-size: 0.9rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.25s;
            font-family: inherit;
            margin-top: 12px;
            box-shadow: 0 8px 20px -6px rgba(37, 99, 235, 0.5);
        }
        
        .btn-change-password:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 28px -6px rgba(37, 99, 235, 0.7);
        }
        
        .login-footer {
            text-align: center;
            margin-top: 22px;
            color: rgba(255, 255, 255, 0.4);
            font-size: 0.75rem;
        }
        
        .login-footer a {
            color: rgba(255, 255, 255, 0.6);
            text-decoration: none;
            transition: color 0.2s;
            font-weight: 500;
        }
        
        .login-footer a:hover {
            color: #22d3ee;
        }
        /* ================================================================
   MOBILE OPTIMIZATION
   ================================================================ */
        
        @media (max-width: 560px) {
            body {
                padding: 12px;
            }
            .login-card {
                padding: 32px 22px 24px;
                border-radius: 20px;
            }
            .login-logo .logo-icon {
                width: 56px;
                height: 56px;
                font-size: 1.5rem;
            }
            .login-logo h2 {
                font-size: 1.2rem;
            }
            .login-logo p {
                font-size: 0.76rem;
            }
            .login-status {
                font-size: 0.68rem;
            }
            .form-group {
                margin-bottom: 16px;
            }
            .form-group label {
                font-size: 0.75rem;
            }
            .input-wrapper input {
                padding: 15px 16px 15px 44px;
                font-size: 16px;
                /* prevents iOS zoom on focus */
                min-height: 52px;
            }
            .input-wrapper .input-icon {
                font-size: 0.9rem;
                left: 13px;
            }
            .form-options {
                flex-direction: column;
                align-items: flex-start;
                gap: 10px;
            }
            .btn-login {
                padding: 16px;
                font-size: 0.95rem;
                min-height: 54px;
            }
            .back-link {
                font-size: 0.78rem;
                padding: 8px 14px;
                min-height: 38px;
            }
        }
        
        @media (max-width: 380px) {
            body {
                padding: 8px;
            }
            .login-card {
                padding: 26px 18px 20px;
                border-radius: 18px;
            }
            .login-logo h2 {
                font-size: 1.08rem;
            }
            .input-wrapper input {
                padding: 14px 14px 14px 40px;
                font-size: 16px;
            }
            .btn-login {
                padding: 14px;
                font-size: 0.9rem;
            }
            .form-options .forgot-link {
                font-size: 0.78rem;
            }
        }
        /* Landscape phones / small height */
        
        @media (max-height: 640px) and (orientation: landscape) {
            body {
                align-items: flex-start;
                padding: 16px;
            }
            .login-card {
                padding: 20px 24px;
            }
            .login-logo {
                margin-bottom: 14px;
            }
            .login-logo .logo-icon {
                width: 44px;
                height: 44px;
                font-size: 1.2rem;
                margin-bottom: 6px;
            }
            .login-logo h2 {
                font-size: 1rem;
            }
            .login-logo p {
                font-size: 0.7rem;
            }
            .login-status {
                margin-bottom: 14px;
            }
            .form-group {
                margin-bottom: 12px;
            }
            .form-options {
                margin-bottom: 14px;
            }
        }
        /* Safe area for iPhone notch */
        
        @supports (padding: max(0px)) {
            body {
                padding-left: max(12px, env(safe-area-inset-left));
                padding-right: max(12px, env(safe-area-inset-right));
                padding-top: max(12px, env(safe-area-inset-top));
                padding-bottom: max(12px, env(safe-area-inset-bottom));
            }
        }
    </style>
</head>

<body>

    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>

    <div class="login-container">
        <a href="index.html" class="back-link">
            <i class="fas fa-arrow-left"></i> Back to Home
        </a>

        <div class="login-card">
            <div class="login-logo">
                <div class="logo-icon">
                    <i class="fas fa-satellite-dish"></i>
                </div>
                <h2>Starlink Ultranet</h2>
                <p>Staff Access Portal</p>
            </div>

            <div class="login-status">
                <span class="dot"></span> Secure Connection
            </div>

            <div id="errorMessage" class="error-message">
                <i class="fas fa-exclamation-circle"></i>
                <span id="errorText">Invalid username or password.</span>
            </div>

            <div id="successMessage" class="success-message">
                <i class="fas fa-check-circle"></i>
                <span id="successText">Success!</span>
            </div>

            <form id="loginForm" autocomplete="on">
                <div class="form-group">
                    <label for="username">Username <span class="required">*</span></label>
                    <div class="input-wrapper">
                        <input type="text" id="username" placeholder="Enter your username" autocomplete="username" autocapitalize="none" spellcheck="false" />
                        <i class="fas fa-user input-icon"></i>
                    </div>
                </div>

                <div class="form-group">
                    <label for="password">Password <span class="required">*</span></label>
                    <div class="input-wrapper">
                        <input type="password" id="password" placeholder="Enter your password" autocomplete="current-password" />
                        <i class="fas fa-lock input-icon"></i>
                        <button type="button" class="toggle-password" id="togglePassword" aria-label="Toggle password visibility">
            <i class="fas fa-eye"></i>
          </button>
                    </div>
                </div>

                <div class="form-options">
                    <label class="remember-me">
          <input type="checkbox" id="rememberMe" />
          Remember me
        </label>
                    <button type="button" class="forgot-link" id="showChangePassword">
          <i class="fas fa-key"></i> Change Password
        </button>
                </div>

                <button type="submit" class="btn-login" id="loginBtn">
        <span class="btn-text"><i class="fas fa-sign-in-alt"></i> Login to Dashboard</span>
        <span class="spinner"></span>
      </button>
            </form>

            <div class="change-password-section">
                <button type="button" class="change-password-toggle" id="changePasswordToggle">
        <i class="fas fa-chevron-down"></i>
        <span>Change Password</span>
      </button>

                <div class="change-password-fields" id="changePasswordFields">
                    <div class="form-group">
                        <label for="currentPassword">Current Password</label>
                        <div class="input-wrapper">
                            <input type="password" id="currentPassword" placeholder="Enter current password" autocomplete="current-password" />
                            <i class="fas fa-lock input-icon"></i>
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="newPassword">New Password</label>
                        <div class="input-wrapper">
                            <input type="password" id="newPassword" placeholder="New password (min 8 chars)" autocomplete="new-password" />
                            <i class="fas fa-key input-icon"></i>
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="confirmPassword">Confirm New Password</label>
                        <div class="input-wrapper">
                            <input type="password" id="confirmPassword" placeholder="Confirm new password" autocomplete="new-password" />
                            <i class="fas fa-check input-icon"></i>
                        </div>
                    </div>
                    <button type="button" class="btn-change-password" id="changePasswordBtn">
          <i class="fas fa-save"></i> Update Password
        </button>
                </div>
            </div>

            <div class="login-footer">
                <p>
                    <i class="fas fa-shield-alt"></i> Secured by Supabase ·
                    <a href="index.html">Back to site</a>
                </p>
            </div>
        </div>
    </div>

    <script>
        // ================================================================
        // SUPABASE CONFIGURATION
        // ================================================================
        const SUPABASE_URL = 'https://ssofuneaqkaiwcdpapig.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_XN2FdoumkmBdhZ2HgFQlTQ_e8EdBbg_';

        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        console.log('✅ Supabase client created');

        // ================================================================
        // LOGIN LOGIC
        // ================================================================
        document.addEventListener('DOMContentLoaded', function() {

            const form = document.getElementById('loginForm');
            const usernameInput = document.getElementById('username');
            const passwordInput = document.getElementById('password');
            const loginBtn = document.getElementById('loginBtn');
            const errorMessage = document.getElementById('errorMessage');
            const errorText = document.getElementById('errorText');
            const successMessage = document.getElementById('successMessage');
            const successText = document.getElementById('successText');
            const rememberMe = document.getElementById('rememberMe');

            function showError(msg) {
                errorText.textContent = msg;
                errorMessage.classList.add('show');
                successMessage.classList.remove('show');
            }

            function showSuccess(msg) {
                successText.textContent = msg;
                successMessage.classList.add('show');
                errorMessage.classList.remove('show');
            }

            function hideMessages() {
                errorMessage.classList.remove('show');
                successMessage.classList.remove('show');
            }

            function setLoading(loading) {
                if (loading) {
                    loginBtn.classList.add('loading');
                    loginBtn.disabled = true;
                } else {
                    loginBtn.classList.remove('loading');
                    loginBtn.disabled = false;
                }
            }

            // Toggle password visibility
            document.getElementById('togglePassword').addEventListener('click', function() {
                const type = passwordInput.type === 'password' ? 'text' : 'password';
                passwordInput.type = type;
                this.querySelector('i').className = type === 'password' ? 'fas fa-eye' : 'fas fa-eye-slash';
            });

            // Toggle change password section
            const cpToggle = document.getElementById('changePasswordToggle');
            const cpFields = document.getElementById('changePasswordFields');
            cpToggle.addEventListener('click', function() {
                const isOpen = cpFields.classList.toggle('open');
                this.classList.toggle('open', isOpen);
                this.querySelector('span').textContent = isOpen ? 'Close Password Change' : 'Change Password';
            });

            document.getElementById('showChangePassword').addEventListener('click', function() {
                if (!cpFields.classList.contains('open')) cpToggle.click();
                cpFields.scrollIntoView({
                    behavior: 'smooth',
                    block: 'center'
                });
            });

            // Change password
            document.getElementById('changePasswordBtn').addEventListener('click', async function() {
                const current = document.getElementById('currentPassword').value.trim();
                const newPwd = document.getElementById('newPassword').value.trim();
                const confirm = document.getElementById('confirmPassword').value.trim();

                hideMessages();
                if (!current) {
                    showError('Please enter your current password.');
                    return;
                }
                if (newPwd.length < 8) {
                    showError('New password must be at least 8 characters.');
                    return;
                }
                if (newPwd !== confirm) {
                    showError('Passwords do not match.');
                    return;
                }

                const {
                    error
                } = await supabaseClient.auth.updateUser({
                    password: newPwd
                });
                if (error) {
                    showError('Error: ' + error.message);
                    return;
                }

                showSuccess('Password updated successfully!');
                document.getElementById('currentPassword').value = '';
                document.getElementById('newPassword').value = '';
                document.getElementById('confirmPassword').value = '';
                passwordInput.value = newPwd;
            });

            // LOGIN
            form.addEventListener('submit', async function(e) {
                e.preventDefault();
                hideMessages();

                const username = usernameInput.value.trim();
                const password = passwordInput.value.trim();

                if (!username) {
                    showError('Please enter your username.');
                    usernameInput.focus();
                    return;
                }
                if (!password) {
                    showError('Please enter your password.');
                    passwordInput.focus();
                    return;
                }

                setLoading(true);

                try {
                    const {
                        data: userData,
                        error: userError
                    } = await supabaseClient
                        .from('custom_users')
                        .select('*')
                        .eq('username', username);

                    if (userError) {
                        setLoading(false);
                        showError('Database error: ' + userError.message);
                        return;
                    }
                    if (!userData || userData.length === 0) {
                        setLoading(false);
                        showError('Username not found. Please check your username.');
                        passwordInput.value = '';
                        passwordInput.focus();
                        return;
                    }

                    const user = userData[0];

                    const {
                        data,
                        error
                    } = await supabaseClient.auth.signInWithPassword({
                        email: user.email,
                        password: password
                    });

                    if (error) {
                        setLoading(false);
                        showError('Invalid password. Please try again.');
                        passwordInput.value = '';
                        passwordInput.focus();
                        return;
                    }

                    if (data.user) {
                        if (rememberMe.checked) {
                            localStorage.setItem('starlink_username', username);
                        } else {
                            localStorage.removeItem('starlink_username');
                        }
                        showSuccess('Login successful! Redirecting...');
                        setTimeout(function() {
                            window.location.href = 'https://reinchemo.github.io/investors/';
                        }, 1200);
                    }
                } catch (err) {
                    setLoading(false);
                    showError('An error occurred. Please try again.');
                    console.error('Login error:', err);
                } finally {
                    setLoading(false);
                }
            });

            // Load remembered username
            const saved = localStorage.getItem('starlink_username');
            if (saved) {
                usernameInput.value = saved;
                rememberMe.checked = true;
                passwordInput.focus();
            }

            // Enter key support
            passwordInput.addEventListener('keydown', function(e) {
                if (e.key === 'Enter') form.dispatchEvent(new Event('submit'));
            });
            usernameInput.addEventListener('keydown', function(e) {
                if (e.key === 'Enter') passwordInput.focus();
            });
        });
    </script>

</body>

</html>
